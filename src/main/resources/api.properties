# Base URL and controller paths. Paths are relative to the API base URL.
conduit.apiUrl=http://127.0.0.1:8080/api
api.articles.path.collection=/articles
api.articles.path.bySlug=/articles/{slug}
api.users.path.registration=/users
api.users.path.login=/users/login
api.user.path.current=/user
api.readiness.path=/tags

# REST Assured request settings. Timeout parameter names are passed to Apache HttpClient.
api.http.auth.header=Authorization
api.http.auth.scheme=Token
api.http.mediaType=application/json
api.http.mapper=JACKSON_2
api.http.connectTimeout.parameter=http.connection.timeout
api.http.connectTimeout.millis=5000
api.http.socketTimeout.parameter=http.socket.timeout
api.http.socketTimeout.millis=10000

# API readiness probe timings.
api.readiness.connectTimeout.millis=2000
api.readiness.requestTimeout.millis=3000
api.readiness.waitTimeout.millis=30000
api.readiness.pollInterval.millis=500

# Wait for a new article's author association to become readable.
api.articles.authorWait.millis=5000
